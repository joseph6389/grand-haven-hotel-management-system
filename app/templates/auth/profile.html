{% extends 'base.html' %}

{% block title %}My Profile — {{ hotel_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="font-serif text-dark mb-0">Staff Profile & Credentials</h3>
    <small class="text-muted">Account settings for {{ user.full_name }}</small>
  </div>
  <span class="badge bg-gold px-3 py-2">{{ user.role.name }} Clearance</span>
</div>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="gh-card p-4">
      <h5 class="font-serif mb-3"><i class="bi bi-person text-gold me-2"></i> Personal Information</h5>
      <form action="{{ url_for('auth.profile') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="update_info">

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Username</label>
          <input type="text" class="form-control" value="{{ user.username }}" disabled>
          <small class="text-muted">Username cannot be altered.</small>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Staff Email</label>
          <input type="email" class="form-control" value="{{ user.email }}" disabled>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Full Legal Name</label>
          <input type="text" class="form-control" name="full_name" value="{{ user.full_name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Direct Phone</label>
          <input type="tel" class="form-control" name="phone" value="{{ user.phone or '' }}" placeholder="+91 98765 43210">
        </div>

        <button type="submit" class="btn btn-gold btn-sm">
          <i class="bi bi-save me-1"></i> Update Profile Information
        </button>
      </form>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="gh-card p-4">
      <h5 class="font-serif mb-3"><i class="bi bi-shield-lock text-gold me-2"></i> Change Security Password</h5>
      <form action="{{ url_for('auth.profile') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="change_password">

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Current Password</label>
          <input type="password" class="form-control" name="current_password" required placeholder="Enter current password">
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">New Password</label>
          <input type="password" class="form-control" name="new_password" required minlength="6" placeholder="Min. 6 characters">
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted text-uppercase fw-semibold">Confirm New Password</label>
          <input type="password" class="form-control" name="confirm_password" required minlength="6" placeholder="Repeat new password">
        </div>

        <button type="submit" class="btn btn-navy btn-sm">
          <i class="bi bi-key me-1"></i> Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
