{% extends 'base.html' %}

{% block title %}404 Page Not Found — {{ hotel_name }}{% endblock %}

{% block body %}
<div class="container py-5 my-auto text-center">
  <div class="kpi-icon mx-auto mb-3" style="width: 76px; height: 76px; font-size: 2.2rem;">
    <i class="bi bi-compass"></i>
  </div>
  <h1 class="font-serif display-4 text-dark">404 Page Not Found</h1>
  <p class="text-muted fs-5 max-w-500 mx-auto mb-4">
    The requested hotel suite, reservation record, or management page could not be located on the server.
  </p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{{ url_for('public.index') }}" class="btn btn-gold">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
