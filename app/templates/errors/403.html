{% extends 'base.html' %}

{% block title %}403 Forbidden — Access Denied — {{ hotel_name }}{% endblock %}

{% block body %}
<div class="container py-5 my-auto text-center">
  <div class="kpi-icon mx-auto mb-3" style="width: 76px; height: 76px; font-size: 2.2rem; background: rgba(198, 40, 40, 0.1); color: #C62828;">
    <i class="bi bi-shield-x"></i>
  </div>
  <h1 class="font-serif display-4 text-dark">403 Forbidden</h1>
  <p class="text-muted fs-5 max-w-500 mx-auto mb-4">
    You do not possess the necessary staff clearance or administrative privileges to access this area.
  </p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('public.index') }}" class="btn btn-navy">
      <i class="bi bi-house me-1"></i> Return to Safety
    </a>
  </div>
</div>
{% endblock %}
